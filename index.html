<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glasses Try-On - MindAR</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
    <style>
      :root {
        --panel-bg: rgba(10, 16, 26, 0.86);
        --panel-border: rgba(146, 170, 196, 0.28);
        --text-main: #f0f5fa;
        --text-muted: #abc0d7;
        --accent: #4db6ff;
        --success: #31b57a;
        --warn: #ff9f43;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: "Segoe UI", "Helvetica Neue", sans-serif;
      }

      a-scene {
        width: 100% !important;
        height: 100% !important;
        display: block !important;
      }

      .controls {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 1000;
        width: min(340px, calc(100vw - 24px));
        max-height: calc(100vh - 24px);
        overflow-y: auto;
        color: var(--text-main);
        background: linear-gradient(160deg, var(--panel-bg), rgba(18, 30, 49, 0.78));
        border: 1px solid var(--panel-border);
        border-radius: 14px;
        padding: 14px;
        backdrop-filter: blur(8px);
        box-shadow: 0 14px 28px rgba(0, 0, 0, 0.32);
      }

      .panel-title {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.2px;
        margin-bottom: 10px;
      }

      .section {
        margin-bottom: 12px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(173, 197, 224, 0.2);
        border-radius: 10px;
        padding: 10px;
      }

      .section-title {
        font-size: 12px;
        font-weight: 700;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.8px;
        margin-bottom: 8px;
      }

      .control-group {
        margin-bottom: 9px;
      }

      .control-group:last-child {
        margin-bottom: 0;
      }

      .control-group label {
        display: block;
        font-size: 12px;
        margin-bottom: 4px;
      }

      .control-group input[type="range"] {
        width: 100%;
        accent-color: var(--accent);
      }

      .button-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      button {
        border: none;
        color: #fff;
        padding: 8px 10px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
        transition: transform 0.12s ease, filter 0.2s ease;
      }

      button:hover {
        filter: brightness(1.08);
        transform: translateY(-1px);
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        transform: none;
      }

      .btn-green { background: var(--success); }
      .btn-blue { background: #257ed8; }
      .btn-orange { background: var(--warn); }
      .btn-teal { background: #00897b; }
      .btn-brown { background: #6d4c41; }

      .status {
        margin-top: 8px;
        font-size: 11px;
        color: var(--text-muted);
      }

      .hint {
        margin-top: 6px;
        font-size: 10px;
        color: var(--text-muted);
        line-height: 1.35;
      }

      @media (max-width: 640px) {
        .controls {
          top: 8px;
          left: 8px;
          width: calc(100vw - 16px);
          max-height: 48vh;
        }

        .panel-title {
          font-size: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="controls">
      <h3 class="panel-title">Glasses Fit</h3>

      <div class="section">
        <div class="section-title">Size</div>
        <div class="control-group">
          <label>Frame Size (pt): <span id="size-points-val">100</span></label>
          <input type="range" id="sizePointsRange" min="40" max="220" step="1" value="100">
        </div>
        <div class="control-group">
          <label for="sizePointsInput">Type Size (pt)</label>
          <input
            type="number"
            id="sizePointsInput"
            min="40"
            max="220"
            step="1"
            value="100"
            style="width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(173, 197, 224, 0.35); background: rgba(10,16,26,0.65); color: #f0f5fa;"
          >
        </div>
      </div>

      <div class="section">
        <div class="section-title">Projection Calibration</div>
        <div class="button-row">
          <button id="startCalibrationBtn" class="btn-orange">Start Position</button>
          <button id="saveCalibrationBtn" class="btn-teal" disabled>Save Position</button>
        </div>
        <div class="button-row" style="margin-top: 8px;">
          <button id="startScaleCalibrationBtn" class="btn-orange">Start Size</button>
          <button id="saveScaleCalibrationBtn" class="btn-teal" disabled>Save Size</button>
        </div>
        <div class="button-row" style="margin-top: 8px;">
          <button id="resetCalibrationBtn" class="btn-brown" style="grid-column: 1 / -1;">Reset All</button>
        </div>
        <div id="calibrationStatus" class="status">Position: OFF | Size: OFF | posOffset=(0.000, 0.000, 0.000) | scaleFactor=1.000</div>
        <div class="hint">Position mode: drag to align, wheel for depth. Size mode: drag up/down to resize. Save when aligned.</div>
      </div>

      <div class="section">
        <div class="section-title">Preset</div>
        <div class="button-row">
          <button id="saveBtn" class="btn-green">Save Preset</button>
          <button id="loadBtn" class="btn-blue">Load Preset</button>
        </div>
      </div>
    </div>

    <a-scene 
      mindar-face 
      embedded 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights: true, alpha: true, antialias: true, sortObjects: true" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <a-asset-item id="glassesModel" src="/models/glassesbonesfinal.glb"></a-asset-item>
      </a-assets>

      <a-camera active="false" position="0 0 0"></a-camera>

      <!-- Anchor to nose bridge (anchor point 168) -->
      <a-entity id="glasses-anchor" mindar-face-target="anchorIndex: 168">
        <!-- Inspector-only debug marker (hidden by default) -->
        <a-sphere
          id="anchor-marker"
          position="0 0 0"
          radius="0.004"
          color="#00ff66"
          visible="false"
          material="shader: flat; transparent: true; opacity: 0.95">
        </a-sphere>

        <a-entity 
          id="glasses"
          gltf-model="#glassesModel"
          position="0 -0.05 -0.15"
          rotation="0 0 0"
          scale="0.1 0.1 0.1">
        </a-entity>
      </a-entity>

      <!-- Generated by main.ts: inspector-only debug points (hidden by default) -->
      <a-entity id="anchor-debug-pool" visible="false"></a-entity>

      <!-- Lighting for realistic rendering -->
      <a-light type="ambient" intensity="1.5"></a-light>
      <a-light type="directional" position="3 3 4" intensity="2.0"></a-light>
      <a-light type="directional" position="-3 2 3" intensity="1.5"></a-light>
      <a-light type="point" position="0 0.5 0" intensity="1.2"></a-light>
    </a-scene>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
